name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar um que ja esteja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Ativa o Pages via API caso ainda esteja desligado no repositorio,
          # dispensando a configuracao manual em Settings.
          enablement: true

      # Publica somente a pagina. Dockerfile, README e configs do nginx nao
      # fazem parte do site.
      - name: Preparar arquivos do site
        run: |
          mkdir -p site
          cp index.html site/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
